<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pencarian Judul Skripsi (Excel + KMP)</title>

    <!-- LIBRARY UNTUK BACA EXCEL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
        }
        .container {
            width: 400px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: #3b6cff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .item {
            background: #eef3ff;
            padding: 8px;
            margin-top: 6px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Pencarian Judul Skripsi</h3>
    <input type="text" id="keyword" placeholder="Masukkan kata kunci">
    <button onclick="cariJudul()">Cari</button>
    <div id="hasil"></div>
</div>

<script>
    let judulSkripsi = [];

    // ===============================
    // BACA FILE EXCEL
    // ===============================
    fetch("dataset_judul_skripsi.xlsx")
        .then(res => res.arrayBuffer())
        .then(data => {
            const workbook = XLSX.read(data, { type: "array" });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(sheet);

            // Ambil kolom "Judul Skripsi"
            judulSkripsi = jsonData.map(item => item["Judul Skripsi"]);
        });

    // ===============================
    // FUNGSI LPS
    // ===============================
    function computeLPS(pattern) {
        let lps = Array(pattern.length).fill(0);
        let length = 0;
        let i = 1;

        while (i < pattern.length) {
            if (pattern[i] === pattern[length]) {
                length++;
                lps[i] = length;
                i++;
            } else {
                if (length !== 0) {
                    length = lps[length - 1];
                } else {
                    lps[i] = 0;
                    i++;
                }
            }
        }
        return lps;
    }

    // ===============================
    // KMP SEARCH
    // ===============================
    function kmpSearch(text, pattern) {
        text = text.toLowerCase();
        pattern = pattern.toLowerCase();

        let lps = computeLPS(pattern);
        let i = 0, j = 0;

        while (i < text.length) {
            if (text[i] === pattern[j]) {
                i++;
                j++;
            }

            if (j === pattern.length) {
                return true;
            } else if (i < text.length && text[i] !== pattern[j]) {
                if (j !== 0) {
                    j = lps[j - 1];
                } else {
                    i++;
                }
            }
        }
        return false;
    }

    // ===============================
    // CARI JUDUL
    // ===============================
    function cariJudul() {
        const keyword = document.getElementById("keyword").value;
        const hasilDiv = document.getElementById("hasil");
        hasilDiv.innerHTML = "";

        judulSkripsi.forEach(judul => {
            if (kmpSearch(judul, keyword)) {
                hasilDiv.innerHTML += `<div class="item">${judul}</div>`;
            }
        });

        if (hasilDiv.innerHTML === "") {
            hasilDiv.innerHTML = "<p>Judul tidak ditemukan</p>";
        }
    }
</script>

</body>
</html>
